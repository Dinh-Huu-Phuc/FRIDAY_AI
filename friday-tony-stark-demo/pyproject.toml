[project]
name = "friday-tony-stark-demo"
version = "0.1.0"
description = "Friday — A Tony Stark-inspired MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "fastmcp",
    "google-genai",
    "httpx",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.1",
    "livekit-plugins-google>=1.5.1",
    "mediapipe",
    "numpy",
    "opencv-python",
    "pydantic>=2.7",
    "pyautogui>=0.9.54",
    "pyodbc",
    "python-dotenv",
    "sqlalchemy",
    "uvicorn",
]

[project.scripts]
friday = "server.server:main"
friday-api = "friday.src.main:main"
friday_api = "friday.src.main:main"
friday_voice = "server.agent_friday:dev" # Points to the wrapper

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["friday", "server"]
